   <!-- JS here -->

   <script>
      // 1. Captura o ID da URL (ex: perfil.html?id=2)
      const urlParams = new URLSearchParams(window.location.search);
      const atletaId = parseInt(urlParams.get('id')) || 2; // Padrão é o ID 1 se não passar nada

      // 2. Consome o arquivo JSON usando Fetch
      fetch('atletas_db.json')
         .then(response => response.json())
         .then(atletas => {
            // 3. Encontra o atleta pelo ID
            const atleta = atletas.find(a => a.id === atletaId);

            if (atleta) {
               const fotoPerfil = document.getElementById('atleta-foto');
               fotoPerfil.src = `imagens/${atleta.foto_perfil}`;
               fotoPerfil.alt = `Foto de ${atleta.nome_completo}`;
               // 4. Injeta os dados básicos no HTML
               document.getElementById('atleta-nome').textContent = atleta.nome_completo;
               document.getElementById('atleta-idade').textContent = "Idade:" + " " + atleta.idade;
               document.getElementById('atleta-genero').textContent = "Gênero:" + " " + atleta.genero;
               document.getElementById('atleta-modalidade').textContent = "Modalidade:" + " " + atleta.modalidade;

               document.getElementById('atleta-numero').textContent = "Número:" + " " + atleta.numero;
               document.getElementById('atleta-categoria').textContent = "Categoria:" + " " + atleta.categoria;


               // 5. Injeta a lista de campeonatos
               const listaCampeonatos = document.getElementById('atleta-campeonatos');
               atleta.sobre_o_atleta.campeonatos_participados.forEach(camp => {
                  const p = document.createElement('p');
                  p.textContent = camp;
                  listaCampeonatos.appendChild(p);
               });

               // 6. Injeta os troféus
               // const containerTrofeus = document.getElementById('atleta-trofeus');
               // atleta.trofeus.forEach(trofeu => {
               //    const img = document.createElement('img');
               //    img.src = trofeu.imagem;
               //    img.alt = trofeu.nome;
               //    img.title = trofeu.nome;
               //    img.className = 'trofeu-img';
               //    containerTrofeus.appendChild(img);
               // });

               const containerTrofeus = document.getElementById('atleta-trofeus-container');
               containerTrofeus.innerHTML = ''; // Limpa o container antes de injetar


               atleta.trofeus.forEach(trofeu => {
                  // 1. Cria a div principal do slide
                  const swiperSlide = document.createElement('div');
                  swiperSlide.className = 'swiper-slide';

                  // 2. Cria a div interna de estilização
                  const softwareItem = document.createElement('div');
                  softwareItem.className = 'tp-home-software-item';
                  softwareItem.style.display = 'flex';
                  softwareItem.style.flexDirection = 'column';
                  softwareItem.style.alignItems = 'center';
                  softwareItem.style.gap = '10px';

                  // 3. Cria o link <a>
                  const linkIcon = document.createElement('a');
                  linkIcon.className = 'tp-home-software-icon';
                  linkIcon.href = '#';
                  linkIcon.title = trofeu.nome; // Mostra o nome do troféu ao passar o mouse



                  // 4. Cria a imagem <img>
                  const imgTrofeu = document.createElement('img');
                  imgTrofeu.src = `imagens/${trofeu.imagem}`;
                  imgTrofeu.alt = trofeu.nome;

                  const nomeTrofeu = document.createElement('p');
                  nomeTrofeu.style.fontSize = '12px';
                  nomeTrofeu.style.textAlign = 'center';
                  nomeTrofeu.style.lineHeight = '1.2';
                  nomeTrofeu.textContent = trofeu.nome; // Injeta o nome dinâmico do JSON

                  // 6. Monta a árvore de elementos (Append)
                  linkIcon.appendChild(imgTrofeu);      // Coloca a imagem dentro do <a>
                  softwareItem.appendChild(linkIcon);    // Coloca o <a> dentro do container
                  softwareItem.appendChild(nomeTrofeu);  // Coloca o <p> dentro do container (embaixo do <a>)
                  swiperSlide.appendChild(softwareItem); // Coloca o bloco completo no slide

                  // 6. Adiciona o slide completo ao Swiper
                  containerTrofeus.appendChild(swiperSlide);
               });




            } else {
               document.getElementById('atleta-nome').textContent = "Atleta não encontrado.";
            }
         })
         .catch(error => {
            console.error("Erro ao carregar a base de dados:", error);
            document.getElementById('atleta-nome').textContent = "Erro ao carregar perfil.";
         });
   </script>
